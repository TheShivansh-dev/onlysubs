services:
  # ── Web admin panel + Telegram bot (single free service) ─────────────────────
  #  The web process also runs the bot via polling on startup (RUN_BOT!=0).
  - type: web
    name: onlysub-admin
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # set in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false          # owner login email
      - key: OWNER_PASSWORD
        sync: false          # owner login password
      - key: BOT_TOKEN
        sync: false          # your bot token (BotFather)
      - key: BOT_USERNAME
        sync: false          # your bot @username (for deep links)
      - key: BOT_CREATOR_GROUP_ID
        sync: false          # optional — group that receives auto-backups
      # Set RUN_BOT=0 only if you run the bot as a separate worker instead.
